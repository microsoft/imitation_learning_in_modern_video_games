seed: 0

data:
  image_height: 224
  image_width: 224
  # predict_depth (must live under `data:`, not just `model:`) because
  # CSGOEmbeddingParser needs it to know to load+concat the raw depth frame
  # (frame_i_depth, from make_depth.py) onto the embedding. _check_and_update_config
  # copies every data.* key into model.* too, so BCModel still sees it as normal.
  # Requires make_depth.py to have already been run on the train/val split files.
  predict_depth: true


model:
  encoder: null
  pretrained_encoder:
    family: dino
    name: dinov2_vitb14
  bc_policy:
    type: lstm # 'mlp', 'lstm', or 'gpt'
    hidden_size: 512
    num_layers: 2
    lstm_hidden_size: 512
    lstm_num_layers: 2
  learning_rate: 3e-4
  lr_warmup_steps: 0 # use no warmup
  joystick_loss_weight: 1.0
  button_loss_weight: 1.0
  train_from_embeddings: True
  # predict_depth: reconstructs the depth map in image space from the LSTM's hidden
  # state at the same timestep -- reuses RGBDecoder (output_channels=1) branched off
  # hidden_repr, so this loss is gradient-connected to the policy. Logged to
  # TensorBoard as depth_loss.
  depth_loss_weight: 0.1
