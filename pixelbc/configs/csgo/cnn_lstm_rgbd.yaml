seed: 42
checkpoint: null
resume_from: null

log:
  minimal_metrics: True
  checkpoint_epoch_freq: 100
  checkpoint_top_k_validation: 3
  checkpoint_last: True
  device_stats_monitor: True
  weights: False
  weights_step_freq: 100
  weights_log_scalars: False

trainer:
  profiler: simple
  max_steps: 500000
  gradient_clip_algorithm: norm
  gradient_clip_val: 1.0
  precision: 16-mixed

data:
  game: "csgo"
  data_path: C:\csgo_data
  train_split_file_path: paper_data_split/csgo_dm_train_files.txt
  validation_split_file_path: paper_data_split/csgo_dm_val_files.txt
  test_split_file_path: null
  image_height: 128
  image_width: 128
  framestacking: 1
  num_actions: 15
  num_joystick_actions: 4
  num_trigger_actions: 1
  num_button_actions: 10
  batch_size: 32
  sequence_length: 100
  downsample: 2
  prefetch_factor: 5
  train_num_workers: 0
  other_num_workers: 0
  decord_num_workers: 0
  use_depth: true

model:
  encoder:
    type: cnn
    cnn_encoder_dim: 4
    cnn_encoder_start_channels: 32
    mlp_encoder_hidden_size: 128
    mlp_encoder_num_layers: 3
    use_image_augmentation: False

  bc_policy:
    type: lstm
    hidden_size: 512
    num_layers: 4
    lstm_hidden_size: 512
    lstm_num_layers: 2
    gpt_num_layers: 4
    gpt_num_heads: 8
    gpt_embedding_dim: 512
    gpt_use_positional_encoding: False
    gpt_bias: True
    gpt_is_causal: True

  learning_rate: 3e-4
  lr_warmup_steps: 0
  joystick_loss_weight: 1.0
  button_loss_weight: 1.0
  train_from_embeddings: False
